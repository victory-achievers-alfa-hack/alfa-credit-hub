services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: sqlite:////data/alfa-credit-hub.db
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-deploy}
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/api/v1/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  backend-data:
